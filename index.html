<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>罗德岛割草行动 · 雏形</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #111; color: #eee;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; }

#hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .1s;
  box-shadow: inset 0 0 120px 30px rgba(220, 30, 30, .8); }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#xpbar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: rgba(0,0,0,.6); }
#xpfill { height: 100%; width: 0; background: linear-gradient(90deg, #ff8a2a, #ffc400); }
#topinfo { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 22px;
  font-size: 15px; font-weight: 700; text-shadow: 0 1px 3px #000; }
#timer { font-size: 20px; letter-spacing: 1px; }
#hpwrap { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: min(320px, 70vw); height: 16px;
  background: rgba(0,0,0,.65); border: 1px solid #555; }
#hpfill { height: 100%; width: 100%; background: linear-gradient(90deg, #2ecc71, #7be495); transition: width .1s; }
#hptext { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 14px; text-shadow: 0 1px 2px #000; }
#bossbar { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); width: min(460px, 86vw); text-align: center; }
#bossname { font-size: 13px; color: #ff6b6b; font-weight: 700; margin-bottom: 3px; text-shadow: 0 1px 2px #000; }
#bosshp { height: 10px; background: rgba(0,0,0,.7); border: 1px solid #a33; }
#bossfill { height: 100%; background: #e03030; }
#banner { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 800;
  letter-spacing: 3px; color: #ffc400; text-shadow: 0 2px 8px #000; background: linear-gradient(90deg, transparent, rgba(0,0,0,.55), transparent);
  padding: 10px 0; animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(1.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#debug { position: absolute; left: 8px; bottom: 8px; font-size: 11px; color: #888; }

#ultbtn { pointer-events: auto; position: absolute; right: 28px; bottom: 34px; width: 84px; height: 84px; border-radius: 50%;
  border: 3px solid #666; background: rgba(0,0,0,.6); color: #aaa; overflow: hidden; font-weight: 800; font-size: 17px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }
#ultbtn span, #ultbtn small { position: relative; z-index: 1; }
#ultbtn small { font-size: 10px; font-weight: 400; opacity: .7; }
#ultfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(255,196,0,.35); }
#ultbtn.ready { border-color: #ffc400; color: #fff; box-shadow: 0 0 18px #ffc400; animation: pulse 1s infinite; }
#ultbtn.active { border-color: #ff8a2a; color: #fff; }
#ultbtn.active #ultfill { background: rgba(255,138,42,.55); }
@keyframes pulse { 50% { box-shadow: 0 0 4px #ffc400; } }
#pausebtn { pointer-events: auto; position: absolute; right: 12px; top: 14px; width: 38px; height: 38px; border: 1px solid #555;
  background: rgba(0,0,0,.5); color: #ddd; font-weight: 800; }

#joy { position: fixed; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
  background: rgba(255,255,255,.08); transform: translate(-50%, -50%); pointer-events: none; }
#joyknob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%;
  background: rgba(255,255,255,.55); transform: translate(-50%, -50%); }

/* 覆盖层 */
.overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; background: rgba(10,11,14,.82); backdrop-filter: blur(3px); padding: 20px; text-align: center; }
.overlay h1 { font-size: clamp(32px, 8vw, 54px); letter-spacing: 6px; font-weight: 900; }
.overlay h2 { font-size: 26px; letter-spacing: 4px; }
.tag { font-size: 11px; letter-spacing: 3px; color: #ffc400; border: 1px solid #ffc400; padding: 3px 10px; }
.sub { color: #999; font-size: 13px; margin-top: -8px; }
.opcard { border-left: 4px solid #e8433a; background: rgba(255,255,255,.06); padding: 12px 18px; text-align: left; max-width: 360px; }
.opname { font-size: 20px; font-weight: 800; }
.opname span { font-size: 12px; color: #888; font-weight: 400; }
.opdesc { font-size: 13px; color: #bbb; margin-top: 4px; }
.hint { font-size: 12px; color: #888; line-height: 1.8; }
button.big { background: #ffc400; color: #111; border: none; font-size: 18px; font-weight: 900; letter-spacing: 4px;
  padding: 14px 46px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
button.big:active { transform: scale(.97); }
button.ghost { background: transparent; color: #aaa; border: 1px solid #555; padding: 10px 30px; font-size: 15px; }
#cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
.card { width: 230px; min-height: 140px; text-align: left; padding: 16px; background: #1e2026; color: #eee;
  border: 1px solid #3a3d45; border-top: 4px solid #ffc400; transition: transform .1s, border-color .1s; }
.card:hover { transform: translateY(-4px); border-color: #ffc400; }
.cname { font-size: 19px; font-weight: 800; }
.clv { font-size: 12px; color: #ffc400; margin: 4px 0 10px; }
.cdesc { font-size: 14px; color: #bbb; line-height: 1.5; }
#overstats { font-size: 16px; line-height: 2; color: #ccc; }
#overstats b { color: #fff; font-size: 20px; }
#overtitle.win { color: #ffc400; }
#overtitle.lose { color: #ff6b6b; }

@media (max-width: 600px) {
  .card { width: 100%; min-height: 0; padding: 12px 14px; }
  #cards { flex-direction: column; gap: 10px; }
  #ultbtn { right: 20px; bottom: 28px; width: 76px; height: 76px; }
}

/* ===== v2：货币、养成、切换 ===== */
.c-lmd, .c-oru { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.c-lmd::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(#ffe066, #c99a0e); box-shadow: 0 0 0 1px #8a6a00; }
.c-lmd { color: #ffd23f; }
.c-oru::before { content: ''; width: 12px; height: 12px; background: linear-gradient(135deg, #ff9aae, #d6264a); transform: rotate(45deg) scale(.85); }
.c-oru { color: #ff7a93; }
.wallet { display: flex; gap: 18px; font-size: 16px; }
#runcur { position: absolute; top: 16px; left: 12px; font-size: 14px; display: flex; gap: 10px; text-shadow: 0 1px 2px #000; }
#shieldfill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: rgba(80, 180, 255, .55); }
#skillinfo { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13px; color: #ffe08a; text-shadow: 0 1px 3px #000; }
#switchbtn { pointer-events: auto; position: absolute; right: 124px; bottom: 40px; width: 70px; height: 70px; border-radius: 50%;
  border: 3px solid #ddd; background: rgba(0,0,0,.6); color: #fff; overflow: hidden; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-size: 11px; touch-action: none; }
#switchbtn b { font-size: 14px; position: relative; z-index: 1; }
#switchbtn span, #switchbtn small { position: relative; z-index: 1; }
#switchbtn small { opacity: .6; font-size: 9px; }
#switchbtn i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.65); }
#switchbtn.disabled { border-color: #555; color: #888; }
#ultbtn #ultname { font-size: 14px; }

#leadsel { display: flex; flex-direction: column; gap: 8px; width: min(380px, 92vw); }
button.opcard { color: #eee; border: 1px solid #333; border-left: 4px solid #e8433a; cursor: pointer; font-family: inherit; max-width: none; width: 100%; }
button.opcard.on { background: rgba(255,196,0,.12); border-color: #ffc400; }
.mbtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
button.big.alt { background: #e8e8e8; }
button.tiny { background: none; border: none; color: #555; font-size: 11px; text-decoration: underline; }

#meta { position: fixed; inset: 0; background: #14161a; display: flex; flex-direction: column; z-index: 5; }
.mtop { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid #2c2f36; }
.mtl { font-size: 20px; font-weight: 900; letter-spacing: 3px; flex: 1; }
#mclose { background: #ffc400; border: none; padding: 8px 20px; font-weight: 800; }
#mtabs { display: flex; gap: 4px; padding: 10px 16px 0; }
.mtab { background: #22252b; color: #aaa; border: none; padding: 10px 22px; font-size: 15px; font-weight: 700; }
.mtab.on { background: #2e3239; color: #fff; box-shadow: inset 0 -3px 0 #ffc400; }
.mtab.locked { color: #666; }
#mbody { flex: 1; overflow-y: auto; padding: 14px 16px 40px; -webkit-overflow-scrolling: touch; }
.mhead { border-left: 5px solid #e8433a; background: #1d2025; padding: 12px 16px; margin-bottom: 14px; }
.mname { font-size: 22px; font-weight: 900; }
.mname span { font-size: 12px; color: #999; margin-left: 10px; font-weight: 400; }
.mtrait { font-size: 13px; color: #bbb; margin-top: 4px; }
.mstat { font-size: 13px; color: #ffc400; margin-top: 6px; }
.msec { margin-bottom: 18px; background: #1b1d22; border: 1px solid #2a2d33; }
.mtitle { background: #262930; padding: 8px 12px; font-weight: 800; font-size: 15px; }
.mtitle span { font-size: 12px; color: #888; font-weight: 400; margin-left: 10px; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid #25282e; font-size: 13px; }
.mc1 { width: 104px; flex-shrink: 0; font-weight: 700; }
.mc2 { width: 52px; flex-shrink: 0; color: #888; font-size: 12px; }
.mdesc { flex: 1; color: #ccc; line-height: 1.5; }
.mact { flex-shrink: 0; }
.mbtn { min-width: 96px; padding: 7px 10px; background: #ffc400; color: #111; border: none; font-weight: 800; font-size: 13px; display: inline-flex; gap: 6px; justify-content: center; }
.mbtn:disabled { background: #33363d; color: #777; cursor: default; }
.mbtn:disabled .c-lmd, .mbtn:disabled .c-oru { color: #888; }
.mbtn.done { background: #23402d; color: #7be495; }
.mbtn .c-lmd { color: #6b4e00; }
.mbtn .c-oru { color: #9a1030; }
.mmod { display: flex; align-items: center; gap: 10px; padding: 10px 12px 4px; border-top: 1px solid #2f323a; font-size: 14px; }
.mmod b { color: #ff7a6b; }
.mmod .mbtn { margin-left: auto; min-width: 70px; }
#metatoast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #ffc400; color: #111; padding: 12px 22px; font-weight: 800; }

.card { position: relative; }
.card.op-exu { border-top-color: #e8433a; }
.card.op-nc { border-top-color: #9fd3ff; }
.card.skill { background: #24222a; }
.ctag { position: absolute; right: 10px; top: 10px; font-size: 11px; color: #999; }
.reward { margin-top: 12px; padding: 12px 20px; background: rgba(255,255,255,.05); line-height: 1.9; font-size: 15px; text-align: left; }
.rtotal { border-top: 1px solid #444; margin-top: 6px; padding-top: 6px; font-weight: 800; }

@media (max-width: 600px) {
  #switchbtn { right: 108px; bottom: 34px; width: 62px; height: 62px; }
  .mrow { flex-wrap: wrap; }
  .mc2 { width: auto; }
  .mdesc { flex-basis: 100%; order: 3; }
  .mact { margin-left: auto; }
}

/* ===== v3：卡牌稀有度 ===== */
.testtag { font-size: 11px; color: #111; background: #7be495; padding: 2px 8px; align-self: center; font-weight: 800; }
.card { border-top-color: var(--rc, #ffc400) !important; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rc) 35%, transparent); }
.card:hover { border-color: var(--rc, #ffc400); }
.card .cname { color: var(--rc); }
.crar { display: inline-block; font-size: 11px; font-weight: 800; color: #111; background: var(--rc); padding: 1px 8px; margin-bottom: 6px; }
.card.r-SR { background: linear-gradient(160deg, #2a2236, #1e2026 60%); }
.card.r-SSR { background: linear-gradient(160deg, #3a2c12, #1e2026 60%); animation: ssr 1.6s ease-in-out infinite; }
@keyframes ssr { 50% { box-shadow: 0 0 22px rgba(255,176,32,.55), inset 0 0 0 1px rgba(255,176,32,.6); } }

/* ===== 资料图鉴 ===== */
#codex { position: fixed; inset: 0; background: #14161a; display: flex; flex-direction: column; z-index: 5; }
#cclose { background: #ffc400; border: none; padding: 8px 20px; font-weight: 800; }
#ctabs { display: flex; gap: 4px; padding: 10px 16px 0; overflow-x: auto; }
#cbody { flex: 1; overflow-y: auto; padding: 14px 16px 40px; -webkit-overflow-scrolling: touch; }
.cbody { padding: 0; }
.ctwrap { overflow-x: auto; }
.ctable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ctable th { background: #22252b; color: #aaa; font-weight: 700; text-align: left; padding: 7px 10px; white-space: nowrap; }
.ctable td { padding: 7px 10px; border-top: 1px solid #25282e; color: #ccc; line-height: 1.5; vertical-align: top; }
.ctable td:first-child { color: #fff; font-weight: 700; white-space: nowrap; }
.ctable small { color: #888; font-weight: 400; }
.rtag { display: inline-block; font-size: 11px; font-weight: 800; color: #111; background: var(--rc); padding: 1px 7px; white-space: nowrap; }
.ctable th .rtag { font-size: 11px; }

/* ===== v4：第三人称 ===== */
#jumpbtn { display: none; pointer-events: auto; position: absolute; right: 34px; bottom: 136px; width: 66px; height: 66px; border-radius: 50%;
  border: 3px solid #ddd; background: rgba(0,0,0,.45); color: #fff; font-weight: 800; font-size: 14px; touch-action: none; }
body.touch #jumpbtn { display: block; }
#lockhint { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); font-size: 13px; color: #fff;
  background: rgba(0,0,0,.55); padding: 6px 14px; white-space: nowrap; }
#topinfo, #runcur, #skillinfo, #debug { text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,.6); }
#debug { color: #333; text-shadow: none; }

/* ===== v5：覆盖层与设置 ===== */
#ov { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
#settings { z-index: 8; }
#setbody { display: flex; flex-direction: column; gap: 6px; width: min(420px, 92vw); }
.srow { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.06); padding: 10px 14px; font-size: 15px; cursor: pointer; }
.srow span { flex: 1; text-align: left; }
.srow b { width: 52px; text-align: right; color: #ffc400; font-size: 14px; }
.srow input[type=range] { width: 150px; accent-color: #ffc400; }
.srow input[type=checkbox] { width: 20px; height: 20px; accent-color: #ffc400; }
#pausebtn { z-index: 2; }
body.touch #cardhint { display: none; }
#settings { background: rgba(10,11,14,.96); }
button.opcard.locked { opacity: .55; border-left-color: #555 !important; }
button.opcard.partner { background: rgba(127,200,255,.07); }
#leadsel { max-height: 46vh; overflow-y: auto; }
#leadsel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(760px, 94vw); max-height: none; overflow: visible; }
#leadsel .opcard { padding: 9px 14px; }
#leadsel .opdesc { font-size: 12px; }
@media (max-width: 600px) {
  #leadsel { grid-template-columns: 1fr; max-height: 40vh; overflow-y: auto; }
  .overlay h1 { font-size: 30px; }
}
#mtabs { overflow-x: auto; flex-shrink: 0; }
.mtab { white-space: nowrap; flex-shrink: 0; }
@media (max-width: 600px) { .mtab { padding: 9px 12px; font-size: 14px; } }
#switchbtn span { font-size: 9px; line-height: 1.1; max-width: 62px; text-align: center; }

</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="ov"></canvas>
<div id="hurt"></div>

<div id="hud" class="hidden">
  <div id="xpbar"><div id="xpfill"></div></div>
  <div id="topinfo"><span id="lv">Lv.1</span><span id="timer">00:00</span><span id="kills">击杀 0</span></div>
  <div id="runcur"></div>
  <div id="hpwrap"><div id="hpfill"></div><div id="shieldfill"></div><span id="hptext"></span></div>
  <div id="bossbar" class="hidden"><div id="bossname"></div><div id="bosshp"><div id="bossfill"></div></div></div>
  <div id="banner" class="hidden"></div>
  <div id="skillinfo"></div>
  <div id="debug"></div>
  <button id="ultbtn"><div id="ultfill"></div><span id="ultname">过载模式</span><small id="ultcd">E</small></button>
  <button id="jumpbtn">跳跃</button>
  <div id="lockhint" class="hidden">点击画面锁定鼠标，移动鼠标转视角（Esc 解锁 / 暂停）</div>
  <button id="switchbtn" class="hidden"><i></i><b>切换</b><span></span><small>Q</small></button>
  <button id="pausebtn">II</button>
</div>

<div id="joy" class="hidden"><div id="joyknob"></div></div>

<div id="menu" class="overlay">
  <div class="tag">ARKNIGHTS FAN GAME · PROTOTYPE</div>
  <h1>罗德岛割草行动</h1>
  <div class="sub">非官方同人作品 · 雏形版</div>
  <div class="wallet"><span class="c-lmd" id="menu-lmd">0</span><span class="c-oru" id="menu-oru">0</span><span id="testtag" class="testtag hidden">测试模式</span></div>
  <div id="leadsel"></div>
  <div class="hint" id="leadhint"></div>
  <div class="mbtns">
    <button id="start" class="big">开始作战</button>
    <button id="metabtn" class="big alt">干员养成</button>
  </div>
  <div class="mbtns"><button id="codexbtn" class="ghost">📖 资料图鉴</button><button id="setbtn" class="ghost">⚙ 设置</button></div>
  <div class="hint">电脑：WASD 移动，鼠标转视角，空格跳跃，E 大招，Q 切换形态，Esc 暂停<br>手机：左边摇杆移动，右边拖动转视角，按钮跳跃 / 大招 / 切换</div>
  <div class="hint" id="menustats"></div>
  <button id="resetbtn" class="tiny">重置存档</button>
</div>

<div id="meta" class="hidden">
  <div class="mtop">
    <div class="mtl">干员养成</div>
    <div class="wallet"><span class="c-lmd" id="m-lmd">0</span><span class="c-oru" id="m-oru">0</span></div>
    <button id="mclose">返回</button>
  </div>
  <div id="mtabs"></div>
  <div id="mbody"></div>
  <div id="metatoast" class="hidden"></div>
</div>

<div id="codex" class="hidden">
  <div class="mtop"><div class="mtl">资料图鉴</div><button id="cclose">返回</button></div>
  <div id="ctabs"></div>
  <div id="cbody"></div>
</div>

<div id="settings" class="overlay hidden">
  <h2>设置</h2>
  <div id="setbody"></div>
  <button id="setclose" class="big">完成</button>
</div>

<div id="levelup" class="overlay hidden">
  <h2>晋升 · 选择一项强化</h2>
  <div class="hint" id="cardhint">点击选择，电脑也可以按 1 / 2 / 3</div>
  <div id="cards"></div>
</div>

<div id="pause" class="overlay hidden">
  <h2>暂停</h2>
  <button id="resume" class="big">继续作战</button>
  <button id="pset" class="ghost">⚙ 设置</button>
  <button id="quit" class="ghost">撤退（保留已获得的奖励）</button>
</div>

<div id="over" class="overlay hidden">
  <h2 id="overtitle"></h2>
  <div id="overstats"></div>
  <div class="mbtns">
    <button id="restart" class="big">再次作战</button>
    <button id="tomenu" class="big alt">返回 / 养成</button>
  </div>
